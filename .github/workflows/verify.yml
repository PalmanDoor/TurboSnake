name: Verify TurboSnake
on:
  push:
    branches: [codex/arena-overhaul]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile all sources and test protocol rules
        run: sh build.sh
      - name: Test two game processes with packet loss
        run: java -cp ".:lib/*:build/tests" NetworkSmoke
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb x11-xserver-utils libgl1-mesa-dri libopenal1
      - name: Render every map with software OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          for map in -1 0 1 2 3 4; do
            timeout 55s xvfb-run -a java -Djava.awt.headless=false -cp '.:lib/*:build/tests' VisualSmoke "$map"
            grep -q "^PASS:" "build/smoke-$map.log"
          done
      - name: Package runnable project
        run: |
          mkdir -p build/package
          cp *.java *.class *.bat *.sh README.md build/package/
          cp -r lib maps Media Fonts Sounds tests build/package/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TurboSnake-screenshots-and-logs
          path: |
            build/screenshots/
            build/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: TurboSnake-Arena
          path: build/package/
